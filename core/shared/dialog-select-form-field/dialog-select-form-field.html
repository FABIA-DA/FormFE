<h1 mat-dialog-title>Select a form field</h1>
<mat-dialog-content>
  <mat-selection-list [multiple]="true" [(ngModel)]="selectedFields" [compareWith]="compareFields">
    @for (field of fields; track field) {
      <mat-list-option [selected]="" [value]="field">{{ field.name }}</mat-list-option>
    }
  </mat-selection-list>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton="filled" [mat-dialog-close]="selectedFields()" cdkFocusInitial>Ok</button>
</mat-dialog-actions>
