<table>
  <tr>
    <th>Form Name</th>
    <td>{{this.form().name}}</td>
  </tr>
  <tr>
    <th>Group Name</th>
    <td>{{this.form().group?.name | optionalString}}</td>
  </tr>
  <tr>
    <th>Field Groups</th>
    <td>
      @for(fieldGroup of this.form().fieldGroups; track fieldGroup.id) {
        <app-field-group-presentation [fieldGroup]="fieldGroup"/>
      }
    </td>
  </tr>
</table>
