@if(this.loading()){
  <mat-progress-bar mode="indeterminate"/>
}
@else {
  <table mat-table [dataSource]="this.dataSource()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name</th>
      <td mat-cell *matCellDef="let element"> {{ element.name }}</td>
    </ng-container>

    <ng-container matColumnDef="groupName">
      <th mat-header-cell *matHeaderCellDef> Group Name</th>
      <td mat-cell *matCellDef="let element"> {{ element.group?.name == null ? '-' : element.group.name }}</td>
    </ng-container>

    <ng-container matColumnDef="fieldGroupCount">
      <th mat-header-cell *matHeaderCellDef> Field Group Count</th>
      <td mat-cell *matCellDef="let element"> {{ element.fieldGroups.length }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
}
