@if(this.loading()){
  <mat-progress-bar mode="indeterminate"/>
}
@else {
  <table mat-table [dataSource]="this.dataSource()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Description </th>
      <td mat-cell *matCellDef="let element"> {{element.description | optionalString | truncate}} </td>
    </ng-container>

    <ng-container matColumnDef="isOptional">
      <th mat-header-cell *matHeaderCellDef> Is Optional </th>
      <td mat-cell *matCellDef="let element"> {{element.isOptional | booleanStringify}} </td>
    </ng-container>

    <ng-container matColumnDef="typeName">
      <th mat-header-cell *matHeaderCellDef> Type Name </th>
      <td mat-cell *matCellDef="let element"> {{element.type.name}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row class="data-row" *matRowDef="let row; columns: displayedColumns;" [routerLink]="['/field-details', row.id]"></tr>
  </table>
}
