@if(this.loading()){
  <mat-progress-bar mode="indeterminate"/>
}
@else {
  <table mat-table [dataSource]="this.dataSource()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Description </th>
      <td mat-cell *matCellDef="let element"> {{element.description | optionalString | truncate}} </td>
    </ng-container>

    <ng-container matColumnDef="regex">
      <th mat-header-cell *matHeaderCellDef> Regex </th>
      <td mat-cell *matCellDef="let element"> {{element.regex}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr class="data-row" mat-row *matRowDef="let row; columns: displayedColumns;" [routerLink]="['field-type-details', row.id]"></tr>
  </table>
}
