@if(this.loading()){
  <mat-progress-bar mode="indeterminate"/>
}
@else {
  <table mat-table [dataSource]="this.dataSource()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name</th>
      <td mat-cell *matCellDef="let element"> {{ element.name }}</td>
    </ng-container>

    <ng-container matColumnDef="groupName">
      <th mat-header-cell *matHeaderCellDef> Group Name</th>
      <td mat-cell *matCellDef="let element"> {{ element.groupName | optionalString }}</td>
    </ng-container>

    <ng-container matColumnDef="fieldGroupCount">
      <th mat-header-cell *matHeaderCellDef> Field Group Count</th>
      <td mat-cell *matCellDef="let element"> {{ element.fieldGroupCount }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row class="data-row" *matRowDef="let row; columns: displayedColumns;" [routerLink]="['form-details', row.id]"></tr>
  </table>
}
