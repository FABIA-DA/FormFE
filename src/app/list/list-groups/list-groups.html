<table mat-table [dataSource]="this.dataSource()">

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name</th>
    <td mat-cell *matCellDef="let element"> {{ element.name }}</td>
  </ng-container>

  <ng-container matColumnDef="parentName">
    <th mat-header-cell *matHeaderCellDef> Parent Group Name</th>
    <td mat-cell *matCellDef="let element"> {{ element.parentName | optionalString }}</td>
  </ng-container>

  <ng-container matColumnDef="subgroupCount">
    <th mat-header-cell *matHeaderCellDef> Subgroup Count</th>
    <td mat-cell *matCellDef="let element"> {{ element.subgroupCount }}
    </td>
  </ng-container>

  <ng-container matColumnDef="formCount">
    <th mat-header-cell *matHeaderCellDef> Form Count</th>
    <td mat-cell *matCellDef="let element"> {{ element.formCount }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row class="data-row" *matRowDef="let row; columns: displayedColumns" [routerLink]="['group-details', row.id]"></tr>
</table>
