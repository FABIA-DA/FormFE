@let field = this.field();
@if(this.loading()){
  <mat-progress-bar mode="indeterminate"/>
}
@else if(field !== undefined) {
  <div class="content-wrapper">
    <div class="button-wrapper">
      <div class="left-button-wrapper">
        <button matFab aria-label="Go back to the list view for fields" [routerLink]="'/list-fields'">
          <mat-icon>arrow_back</mat-icon>
        </button>
      </div>
      <div class="right-button-wrapper">
        <button matFab aria-label="Button to edit this field" [routerLink]="['/edit-field', field.id]">
          <mat-icon>edit</mat-icon>
        </button>
        <button matFab aria-label="Button to delete this field" (click)="delete()">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
    <app-field-presentation [field]="field"/>
  </div>
}
