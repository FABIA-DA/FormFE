@if(this.loading()){
  <mat-progress-bar mode="indeterminate"/>
}
@else {
  <table mat-table [dataSource]="this.dataSource()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="singleChoiceFieldCount">
      <th mat-header-cell *matHeaderCellDef> Single Choice Field Count </th>
      <td mat-cell *matCellDef="let element"> {{element.singleChoiceFields.length}} </td>
    </ng-container>

    <ng-container matColumnDef="fieldCount">
      <th mat-header-cell *matHeaderCellDef> Field Count </th>
      <td mat-cell *matCellDef="let element"> {{element.fields.length}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
}
