@let form = this.form();
@if(this.loading()){
  <mat-progress-bar mode="indeterminate"/>
}
@else if(form !== undefined){
  <div class="header-wrapper">
    <h1>{{form.name}}</h1>
    <div>
      <button matFab aria-label="Button to edit this form" [routerLink]="['edit-form', form.id]">
        <mat-icon>edit</mat-icon>
      </button>
      <button matFab aria-label="Button to delete this form" (click)="delete()">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
}
